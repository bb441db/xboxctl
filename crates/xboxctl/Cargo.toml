[package]
name = "xboxctl"
version = "0.1.0"
edition = "2024"
description = "Command-line research utility for Xbox USB controllers"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
gip = { version = "0.1.0", path = "../gip" }
rusb = "0.9"
xbox-virtual-device = { path = "../xbox-virtual-device" }

[features]
# Build libusb from source instead of using the system library (Windows/macOS).
vendored-libusb = ["rusb/vendored"]
