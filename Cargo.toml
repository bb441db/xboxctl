[package]
name = "xboxctl"
version = "0.1.0"
edition = "2024"
description = "Inspect and update the firmware of Xbox (GIP) controllers"
license = "0BSD"

[dependencies]
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
# libusb is always built from source, so no system libusb is needed.
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.11.0"
ureq = "3.4.2"
