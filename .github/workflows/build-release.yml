name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (e.g. v1.4.0)"
        required: true
        type: string
      dry_run:
        description: "Build and validate without publishing a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      change_log: ${{ steps.changelog.outputs.change_log }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install git cliff
        env:
          GIT_CLIFF_VERSION: 2.9.1
        run: |
          wget "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xvzf git-cliff-*.tar.gz
          cp "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin
      - name: Regenerate changelog
        id: changelog
        run: |
          change_log=$(git-cliff --unreleased --tag "${{ inputs.version }}")
          echo "change_log<<EOF" >> "$GITHUB_OUTPUT"
          echo "${change_log}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Package source for build job
        run: tar --exclude=.git -czf /tmp/source.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: /tmp/source.tar.gz
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
      - name: Extract source
        run: tar -xzf source.tar.gz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
      - name: Install musl target for pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Build
        env:
          CI_VERSION: ${{ inputs.version }}
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package artifacts
        run: |
          mkdir -p target/artifacts
          mv target/${{ matrix.target }}/release/xboxctl target/artifacts/xboxctl-linux-${{ matrix.arch }}
          cd target/artifacts
          sha256sum xboxctl-linux-${{ matrix.arch }} > xboxctl-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xboxctl-linux-${{ matrix.arch }}
          path: |
            target/artifacts/xboxctl-linux-${{ matrix.arch }}
            target/artifacts/xboxctl-linux-${{ matrix.arch }}.sha256

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: xboxctl-*
          merge-multiple: true
      - name: Show checksum (dry run)
        if: ${{ inputs.dry_run == true }}
        run: cat release-artifacts/xboxctl-*.sha256
      - name: Create Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: ${{ needs.prepare.outputs.change_log }}
          files: |
            release-artifacts/xboxctl-*
